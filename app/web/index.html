<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRAND}}</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --accent:#ff5d8f; --text:#e8e8ea; --dim:#8a8f98; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         display:flex; flex-direction:column; height:100dvh; max-width:640px; margin:0 auto; }
  header { padding:14px 18px; border-bottom:1px solid #262a33; display:flex; align-items:center; gap:10px; }
  header .logo { width:34px; height:34px; border-radius:50%; background:var(--accent);
                 display:grid; place-items:center; font-size:18px; }
  header small { color:var(--dim); display:block; }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:14px; line-height:1.55; white-space:pre-wrap;
         word-break:break-word; font-size:15px; }
  .ai { background:var(--card); border-bottom-left-radius:4px; align-self:flex-start; }
  .me { background:var(--accent); color:#fff; border-bottom-right-radius:4px; align-self:flex-end; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; }
  .code-chip { background:#262a33; border:1px dashed var(--accent); border-radius:8px; padding:8px 12px;
               font-family:ui-monospace,monospace; font-size:16px; letter-spacing:1px; cursor:pointer; }
  form { display:flex; gap:10px; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
         border-top:1px solid #262a33; }
  input { flex:1; background:var(--card); border:1px solid #2c313c; color:var(--text);
          border-radius:12px; padding:12px 14px; font-size:15px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { background:var(--accent); border:0; color:#fff; border-radius:12px; padding:0 20px;
           font-size:15px; cursor:pointer; }
  a { color:var(--accent); }
  .cards { display:flex; flex-direction:column; gap:10px; }
  .reco { background:var(--card); border-radius:12px; padding:12px; }
  .reco img { width:100%; max-height:260px; object-fit:cover; border-radius:8px; }
  .reco b { font-size:16px; }
  .reco .why { color:var(--dim); font-size:13px; margin-top:6px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; align-self:flex-start; max-width:82%; }
  .opt { background:transparent; border:1.5px solid var(--accent); color:var(--accent);
         border-radius:20px; padding:8px 16px; font-size:14px; cursor:pointer; }
  .opt:active { background:var(--accent); color:#fff; }
  .ai-use { margin-left:auto; background:transparent; border:1px solid var(--accent);
            color:var(--accent); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; }
  #promptbox { display:none; background:var(--card); border:1px dashed var(--accent);
               border-radius:10px; margin:10px 16px 0; padding:12px; font-size:13px;
               color:var(--dim); white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <div class="logo">❤</div>
  <div><b>{{BRAND}}</b><small>AI 红娘 · 网页可用,你的 AI 也能接入</small></div>
  <button class="ai-use" id="aiuse">在你的 AI 里用</button>
</header>
<div id="promptbox"></div>
<div id="chat"></div>
<form id="f">
  <input id="inp" placeholder="输入回答…" autocomplete="off">
  <button>发送</button>
</form>
<script>
const chat = document.getElementById('chat');
const f = document.getElementById('f');
const inp = document.getElementById('inp');
let code = sessionStorage.getItem('visit_code') || null;  // 仅存内存/会话,刷新可用回访码找回
let mode = code ? 'chat' : 'boot';

function add(cls, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = html;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const AI_PROMPT = `我想用「AI丘比特」找对象。它是一个 MCP 服务,地址:
${location.origin}/mcp

请这样帮我:
1. 如果你所在的平台支持添加 MCP 连接器(比如 Claude 的 设置→Connectors→Add custom connector,或 ChatGPT 的连接器设置),请一步一步教我把上面这个地址加进去。
2. 添加成功后,调用 register_start 工具帮我注册,然后一题一题地问我 16 个问题,自然聊天的方式,不要一次抛几题。
3. 提醒我保存好回访码(那是唯一凭证),并引导我上传 3 张照片。
4. 以后我每天来问你"今天有推荐吗",你就调用 get_recommendations 给我看今日推荐。
5. 如果你没法添加 MCP 连接器,就直接告诉我打开 ${location.origin} 在网页里完成,一样能用。`;

document.getElementById('aiuse').onclick = async () => {
  const box = document.getElementById('promptbox');
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  box.textContent = AI_PROMPT + '\n';
  const btn = document.createElement('button');
  btn.className = 'opt';
  btn.textContent = '一键复制这段提示词';
  btn.onclick = () => { navigator.clipboard.writeText(AI_PROMPT); btn.textContent = '✅ 已复制,去粘贴给你的 AI 吧'; };
  box.appendChild(btn);
  box.style.display = 'block';
};

async function api(path, body) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify(body||{})});
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail || '出错了');
  return j;
}

function showOptions(opts) {
  document.querySelectorAll('.opts').forEach(o => o.remove());  // 只保留最新一组
  if (!opts || !opts.length) return;
  const row = document.createElement('div');
  row.className = 'opts';
  for (const o of opts) {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o.label;
    b.onclick = () => {
      if (o.value === null || o.value === undefined) {
        inp.placeholder = o.label.includes('邮箱') ? '输入你的邮箱地址…' : '在这里输入…';
        inp.focus();
        return;
      }
      row.remove();
      add('me', esc(o.value));
      handleInput(o.value, true);
    };
    row.appendChild(b);
  }
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function showQuestion(q) {
  add('ai', esc(q.text) + (q.hint ? `\n<span class="hint">${esc(q.hint)}</span>` : ''));
  showOptions(q.options);
  inp.placeholder = '输入回答…';
}

async function boot() {
  add('ai', '你好呀,我是你的 AI 红娘 💕\n回答 16 个小问题 + 3 张照片,我每天给你推 3 位可能来电的人。');
  showOptions([{label: '🚀 开始注册', value: '开始'},
               {label: '我有回访码(LOVE-开头,直接输入)', value: null}]);
}

async function startRegister() {
  const j = await api('/api/register/start');
  code = j.visit_code;
  sessionStorage.setItem('visit_code', code);
  add('ai', '这是你的<b>回访码</b>,唯一凭证,点一下复制,务必保存好:');
  const chip = add('ai', `<span class="code-chip">${code}</span>`);
  chip.querySelector('.code-chip').onclick = () => { navigator.clipboard.writeText(code); alert('已复制'); };
  showQuestion(j.next_question);
  mode = 'quiz';
}

async function sendAnswer(text) {
  const j = await api('/api/answer', {visit_code: code, answer: text});
  if (j.error) { add('ai', '⚠️ ' + esc(j.error)); if (j.next_question) showOptions(j.next_question.options); return; }
  if (j.done) {
    mode = 'chat';
    add('ai', esc(j.extra || '问卷完成!'));
    const u = await api('/api/upload_link', {visit_code: code});
    add('ai', `📷 点这里上传照片(15分钟内有效):<a href="${u.upload_url}" target="_blank">上传照片</a>\n\n之后随时输入「推荐」看今日推荐,「信箱」看谁想认识你,「我的」看资料。`);
  } else {
    showQuestion(j.next_question);
  }
}

function renderRecos(j) {
  if (!j.pool_open) { add('ai', esc(j.message)); return; }
  if (!j.recommendations.length) { add('ai', '今天池子里暂时没有新的合适人选,明天再来看看~'); return; }
  const wrap = add('ai', '<div class="cards"></div>');
  const cards = wrap.querySelector('.cards');
  for (const r of j.recommendations) {
    const c = document.createElement('div');
    c.className = 'reco';
    c.innerHTML = `${r.photos && r.photos[0] ? `<img src="${r.photos[0]}">` : ''}
      <div style="margin-top:8px"><b>${esc(r.nickname)}</b> · ${r.age ?? '?'}岁 · ${esc(r.city||'')}</div>
      <div style="margin-top:4px">${esc(r.intro||'')}</div>
      <div class="why">💘 ${esc(r.reason||'')}</div>
      <div class="hint">想认识TA?输入:打招呼 ${r.target_id} 你想说的话</div>`;
    cards.appendChild(c);
  }
  (j.unread_events||[]).forEach(e => add('ai', '🔔 ' + esc(e.kind)));
}

async function chatCmd(text) {
  if (/^(推荐|看推荐)/.test(text)) { renderRecos(await api('/api/recommendations', {visit_code: code})); return; }
  if (/^(信箱|收件箱)/.test(text)) {
    const j = await api('/api/inbox', {visit_code: code});
    if (!j.pending_greetings.length) { add('ai', '暂时没有人打招呼,把资料照片弄好看点会更受欢迎哦~'); return; }
    for (const g of j.pending_greetings) {
      add('ai', `💌 <b>${esc(g.from.nickname)}</b>(${g.from.age}岁·${esc(g.from.city||'')})付费想认识你:\n“${esc(g.message)}”\n剩余 ${g.hours_left} 小时\n同意输入:同意 ${g.greeting_id};拒绝输入:拒绝 ${g.greeting_id}`);
    }
    return;
  }
  if (/^(我的|资料)/.test(text)) {
    const j = await api('/api/me', {visit_code: code});
    add('ai', `昵称:${esc(j.nickname||'')}\n状态:${j.status}\n余额:${j.balance} U\n照片:${j.photos.length} 张\n想改答案直接说,例如「改 q11 爬山、滑雪、撸猫」`);
    return;
  }
  let m = text.match(/^打招呼\s+(\d+)\s+([\s\S]+)/);
  if (m) {
    const j = await api('/api/greeting', {visit_code: code, target_id: +m[1], message: m[2]});
    if (j.payment) {
      const p = j.payment;
      add('ai', `请转账完成打招呼(15分钟内):\n链:${p.chain}(${p.token})\n地址:<span class="code-chip">${p.address}</span>\n金额:<b>${p.amount}</b>\n⚠️ ${esc(p.note)}\n到账后输入:查单 ${p.order_id}`);
    } else { add('ai', j.paid === 'balance' ? '✅ 已用余额支付,对方已收到你的打招呼!' : '✅ ' + j.status); }
    return;
  }
  m = text.match(/^查单\s+(\d+)/);
  if (m) {
    const j = await api('/api/order/status', {visit_code: code, order_id: +m[1]});
    add('ai', j.status === 'paid' ? '✅ 到账了!对方已收到你的打招呼。' :
              j.status === 'pending' ? '还没查到,链上确认后我就能看到,稍等再查。' : '订单已过期,请重新发起。');
    return;
  }
  m = text.match(/^(同意|拒绝)\s+(\d+)/);
  if (m) {
    const j = await api('/api/greeting/respond', {visit_code: code, greeting_id: +m[2], accept: m[1] === '同意'});
    if (j.status === 'matched') {
      add('ai', `🎉 匹配成功!TA的联系方式:<b>${esc(j.contact_exchange.contact)}</b>\n(对方也同时看到了你的联系方式)`);
    } else { add('ai', '已婉拒,对方的 1U 会退回TA的余额。'); }
    return;
  }
  m = text.match(/^改\s+(\w+)\s+([\s\S]+)/);
  if (m) { await api('/api/update_answer', {visit_code: code, key: m[1], answer: m[2]}); add('ai', '✅ 已更新'); return; }
  if (/^(照片|传照片|上传)/.test(text)) {
    const u = await api('/api/upload_link', {visit_code: code});
    add('ai', `📷 <a href="${u.upload_url}" target="_blank">点这里上传照片</a>(15分钟内有效)`);
    return;
  }
  add('ai', '可以输入:推荐 / 信箱 / 我的 / 照片 / 打招呼 <编号> <留言> / 同意 <编号> / 拒绝 <编号> / 改 <题目key> <新答案>');
}

async function handleInput(text, fromOption) {
  try {
    if (mode === 'boot') {
      if (/^LOVE-/i.test(text)) {
        code = text.toUpperCase(); sessionStorage.setItem('visit_code', code);
        const j = await api('/api/me', {visit_code: code});
        if (j.next_question) { mode = 'quiz'; add('ai', '欢迎回来!继续问卷:'); showQuestion(j.next_question); }
        else { mode = 'chat'; add('ai', `欢迎回来,${esc(j.nickname||'')}!`); showOptions([{label:'💘 今日推荐',value:'推荐'},{label:'💌 信箱',value:'信箱'},{label:'👤 我的资料',value:'我的'}]); (j.unread_events||[]).forEach(ev => add('ai','🔔 '+esc(ev.kind))); }
      } else { await startRegister(); }
    } else if (mode === 'quiz') { await sendAnswer(text); }
    else { await chatCmd(text); }
  } catch (err) { add('ai', '⚠️ ' + esc(err.message)); }
}

f.onsubmit = async (e) => {
  e.preventDefault();
  const text = inp.value.trim();
  if (!text) return;
  document.querySelectorAll('.opts').forEach(o => o.remove());
  add('me', esc(text));
  inp.value = '';
  await handleInput(text, false);
};
if (code) {
  mode = 'chat';
  add('ai', '欢迎回来!');
  showOptions([{label:'💘 今日推荐',value:'推荐'},{label:'💌 信箱',value:'信箱'},{label:'👤 我的资料',value:'我的'},{label:'📷 传照片',value:'照片'}]);
} else { boot(); }
</script>
</body>
</html>
